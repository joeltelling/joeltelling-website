<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3b1d8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Crack locks. Steal snacks. Panic gracefully.">
  <title>Lock Buster</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="vignette"></div>

  <div id="hud">
    <div class="stat">
      <span class="label">TIME</span>
      <span class="value" id="time">30.0</span>
    </div>
    <div class="stat mid">
      <span class="label">SCORE</span>
      <span class="value" id="score">0</span>
    </div>
    <div class="stat right">
      <span class="label" id="streak">STREAK 0</span>
      <span class="value" id="combo">x1</span>
    </div>
    <div id="bar"><i id="barfill"></i></div>
  </div>

  <!-- Start screen -->
  <div id="menu" class="overlay">
    <div class="card">
      <svg class="mascot" viewBox="0 0 100 112" aria-hidden="true">
        <path d="M28 52 V34 a22 22 0 0 1 44 0 V52" fill="none" stroke="#1a0b3d" stroke-width="16" stroke-linecap="round"/>
        <path d="M28 52 V34 a22 22 0 0 1 44 0 V52" fill="none" stroke="#cfd8ff" stroke-width="8" stroke-linecap="round"/>
        <rect x="12" y="46" width="76" height="60" rx="16" fill="#ffd23f" stroke="#1a0b3d" stroke-width="5"/>
        <circle cx="36" cy="70" r="10" fill="#fff" stroke="#1a0b3d" stroke-width="3"/>
        <circle cx="64" cy="70" r="10" fill="#fff" stroke="#1a0b3d" stroke-width="3"/>
        <circle class="pupil" cx="32" cy="72" r="4.5" fill="#1a0b3d"/>
        <circle class="pupil" cx="60" cy="72" r="4.5" fill="#1a0b3d"/>
        <path d="M36 92 q4 -6 8 0 t8 0 t8 0 t4 0" fill="none" stroke="#1a0b3d" stroke-width="4" stroke-linecap="round"/>
        <path d="M80 60 q4 6 0 10 q-4 -4 0 -10z" fill="#5ad1ff" stroke="#1a0b3d" stroke-width="2"/>
      </svg>
      <h1>LOCK<br>BUSTER</h1>
      <p class="tag">Crack locks. Steal snacks.<br>Panic gracefully.</p>
      <button id="play" class="btn big">PLAY</button>
      <p class="how">The code is <b>right there</b>.<br>You just have to be <b>fast</b>.</p>
      <div class="row">
        <span id="best-menu" class="best"></span>
        <button id="snd" class="btn small">Sound: ON</button>
      </div>
    </div>
  </div>

  <!-- Game over screen -->
  <div id="over" class="overlay hidden">
    <div class="card">
      <h2 id="over-title">BUSTED!</h2>
      <p id="over-quip" class="quip"></p>
      <div class="score-big"><span id="over-score">0</span></div>
      <div id="over-new" class="newbest hidden">NEW BEST!</div>
      <div class="stats">
        <div><b id="st-locks">0</b><span>locks</span></div>
        <div><b id="st-streak">0</b><span>best streak</span></div>
        <div><b id="st-fast">-</b><span>fastest</span></div>
      </div>
      <p class="rank">Rank: <b id="over-rank"></b></p>
      <p class="haul" id="over-haul"></p>
      <button id="retry" class="btn big">TRY AGAIN</button>
      <div class="row">
        <button id="share" class="btn small">Share</button>
        <button id="to-menu" class="btn small">Menu</button>
      </div>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script>
    // dev-only: index.html?selftest runs an automated playthrough
    if (/[?&]selftest/.test(location.search)) {
      var s = document.createElement('script');
      s.src = 'js/selftest.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
